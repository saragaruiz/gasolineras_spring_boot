<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}">

</head>
<body class="container">

<nav>
    <ul>
        <li><a href="/clientes/web">Clientes </a></li>
        <li><a href="/provincias/web">Provincias </a></li>
        <li><a href="/gasolineras/web">Gasolineras</a></li>
        <li><a href ="/clientes/registros/">Ver Registros</a></li>
        <li class ="sesion"><a href="/login">Cerrar Sesión</a></li>
        <li class ="cambiar">
            <a href="/clientes/cambiar-password?origen=admin">Cambiar Contraseña</a>
        </li>
    </ul>
</nav>
<a href="/clientes/nuevo">
<button type="submit">Crear cliente</button>
</a>
<br>
<div class="contenido">
    <h1>LISTADO DE CLIENTES</h1>
    <div class="buscar">
        <form action="/clientes/web" method="get" class="buscador" id="formBuscar">
            <div class="buscador-inner">
                <i class="ti ti-search"></i>
                <input type="text" name="buscar" placeholder="Buscar cliente..."
                       th:value="${buscar}"
                       oninput="clearTimeout(window._t); window._t = setTimeout(() => document.getElementById('formBuscar').submit(), 400)"/>
                <button th:if="${buscar != null}" type="button"
                        onclick="window.location.href='/clientes/web'">Limpiar</button>
            </div>
        </form>
    </div>
    <br><br>
    <div class="filtrar">
    <a th:href="@{/clientes/web}">
        <button>Ver Todos</button>
    </a>
    <a th:href="@{/clientes/web(soloActivos=true)}">
        <button>Ver Activos</button>
    </a>
    </div>
<table>
    <thead>
    <tr>
        <th>ID CLIENTE</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Usuario</th>
        <th>DNI</th>
        <th>Activo</th>
        <th>Gasolinera Asociada</th>
        <th>Rol</th>
        <th>Opciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="c : ${clientes}">
        <form th:action="@{/clientes/guardar}" method="post">
            <input type="hidden" name="id" th:value="${c.clientId}"/>
            <input type="hidden" name="origen" value="admin"/>

        <td>
            <input type="hidden" name="id" th:value="${c.clientId}" />
            <span th:text="${c.clientId}"></span>
        </td>
        <td>
        <span th:if="${editingId != c.clientId}"
              th:text="${c.name}"></span>

        <input th:if="${editingId == c.clientId}"
               type="text"
               name="name"
               th:value="${c.name}" />
        </td>

        <td>
            <span th:if="${editingId != c.clientId}" th:text="${c.surname}"></span>
            <input th:if="${editingId == c.clientId}"
                   type="text"
                   name="surname"
                   th:value="${c.surname}" />
        </td>

        <td>
            <span th:if="${editingId != c.clientId}" th:text="${c.username}"></span>
            <input th:if="${editingId == c.clientId}"
                   type="text"
                   name="username"
                   th:value="${c.username}" />
        </td>

            <td>
                <span th:if="${editingId != c.clientId}" th:text="${c.nif}"></span>
                <input th:if="${editingId == c.clientId}"
                       type="text"
                       name="nif"
                       th:value="${c.nif}" />
            </td>

            <td>
    <span th:if="${editingId != c.clientId}"
          th:text="${c.active ? 'Activo' : 'Inactivo'}">
    </span>

                <select name="active" th:if="${editingId == c.clientId}">
                    <option value="true" th:selected="${c.active}">Activo</option>
                    <option value="false" th:selected="${!c.active}">Inactivo</option>
                </select>
            </td>

            <td>
    <span th:if="${editingId != c.clientId}"
          th:text="${c.gasStation != null ? c.gasStation.name : 'Sin asignar'}">
    </span>

                <select th:if="${editingId == c.clientId}"
                        name="gasStationId">
                    <option value="">Sin asignar</option>
                    <option th:each="g : ${gasolineras}"
                            th:value="${g.gasStationId}"
                            th:text="${g.name}"
                            th:selected="${c.gasStation != null and c.gasStation.gasStationId == g.gasStationId}">
                    </option>
                </select>
            </td>

        <td th:text="${c.isAdmin ? 'ADMIN' : 'CLIENTE'}"></td>

            <!--OPCIONES -->
        <td>
            <div class="acciones">
                <div th:if="${editingId != c.clientId}" class="normal">
                    <a class="editar" th:href="@{/clientes/web(editingId=${c.clientId}, pagina=${paginaActual}, buscar=${buscar})}">Editar</a>
                    <a class="borrar" th:href="@{'/clientes/eliminar/' + ${c.clientId}}" onclick="return confirm('¿Seguro que quiere eliminar este cliente?')">Eliminar</a>

                    <a th:if="${!c.admin}" class="admin" th:href="@{'/clientes/admin/' + ${c.clientId}}"> Admin</a>
                    <a th:if="${c.admin}" class="noAdmin" th:href="@{'/clientes/quitar-admin/' + ${c.clientId}}">Quitar Admin</a>
                </div>
                <div th:if="${editingId != null and editingId == c.clientId}" class="edicion">
                    <button type="submit" class="guardar">Guardar</button>
                    <button type="button" class="cancelar"
                            th:onclick="'window.location.href=\'/clientes/web?pagina=' + ${paginaActual} + '\''">Cancelar</button>
            </div>
            </div>
        </form>
    </tr>
    </tbody>

</table>
    <div class="paginacion">
        <a th:if="${paginaActual > 0}"
           th:href="@{/clientes/web(pagina=${paginaActual - 1}, soloActivos=${soloActivos}, buscar=${buscar})}">
            &laquo; Anterior
        </a>
        <span th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}">
        <a th:href="@{/clientes/web(pagina=${i}, soloActivos=${soloActivos}, buscar=${buscar})}"
           th:text="${i + 1}"
           th:classappend="${i == paginaActual} ? 'activa' : ''">
        </a>
    </span>
        <a th:if="${paginaActual < totalPaginas - 1}"
           th:href="@{/clientes/web(pagina=${paginaActual + 1}, soloActivos=${soloActivos}, buscar=${buscar})}">
            Siguiente &raquo;
        </a>
    </div>
</div>
</body>
</html>
