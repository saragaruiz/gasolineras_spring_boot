<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Gasolinera</title>
    <link rel="stylesheet" th:href="@{/css/nuevoCliente.css}">
</head>
<body>
<div class="registro">
    <h2>CREAR GASOLINERA</h2>
    <form action="/gasolineras/guardar" method="post">
        <input type="text" name="name" placeholder="Nombre">
        <input type="number" step="0.01" name="petrolPrice" placeholder="Precio">
        <select name="provinceId">
            <option value="">Selecciona la Provincia</option>
            <option th:each="p : ${provincias}"
                    th:value="${p.provinceId}"
                    th:text="${p.name}">
            </option>
        </select>
        <button type="submit">Guardar</button>
        <button type="button" class="cancelar" onclick="window.location.href='/gasolineras/web'">Cancelar</button>

    </form>
</div>
</body>
</html>
