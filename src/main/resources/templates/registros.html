<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/registros.css}">

    <title>Registros</title>
</head>
<body>
<nav>
    <ul>
        <li><a href="/clientes/web">Atrás</a></li>
    </ul>
</nav>
<h2>REGISTROS DE USUARIOS</h2>

<form action="/clientes/registros" method="get" class="buscador" id="formBuscarRegistros">
    <input type="text" name="buscar" placeholder="Buscar por nombre..."
           th:value="${buscar}"
           oninput="clearTimeout(window._t); window._t = setTimeout(() => document.getElementById('formBuscarRegistros').submit(), 400)"/>
    <button th:if="${buscar != null}" type="button"
            onclick="window.location.href='/clientes/registros'">Limpiar</button>
</form>

<div th:if="${registros.isEmpty()}" class="vacio">
    No hay registros que mostrar.
</div>
<table th:if="${!registros.isEmpty()}">
    <thead>
    <tr>
        <th>Cliente</th>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Gasolinera</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${registros}">
        <td th:text="${r.cliente.name + ' ' + r.cliente.surname}"></td>
        <td class="fecha" th:text="${r.creationDate}"></td>
        <td>
            <span class="badge"
                th:classappend="${r.tipo == 'Alta'} ? 'badge-alta' :
                (${r.tipo == 'Baja'} ? 'badge-baja' :
                (${r.tipo == 'Perfil editado'} ? 'badge-edit' :
                (${r.tipo == 'Contraseña cambiada'} ? 'badge-pass' :
                (${r.tipo == 'Asignado admin' or r.tipo == 'Quitado admin'} ? 'badge-admin' :
                (${r.tipo == 'Gasolinera favorita cambiada'} ? 'badge-gas' : 'badge-default')))))"
                th:text="${r.tipo}">
            </span>
        </td>
        <td th:text="${r.gasolinera != null ? r.gasolinera.name : '—'}"></td>
    </tr>
    </tbody>
    <div class="paginacion">
        <a th:if="${paginaActual > 0}"
           th:href="@{/clientes/registros(pagina=${paginaActual - 1}, buscar=${buscar})}">
            &laquo; Anterior
        </a>
        <span th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}">
        <a th:href="@{/clientes/registros(pagina=${i}, buscar=${buscar})}"
           th:text="${i + 1}"
           th:classappend="${i == paginaActual} ? 'activa' : ''">
        </a>
    </span>
        <a th:if="${paginaActual < totalPaginas - 1}"
           th:href="@{/clientes/registros(pagina=${paginaActual + 1}, buscar=${buscar})}">
            Siguiente &raquo;
        </a>
    </div>
</table>

</body>
</html>
