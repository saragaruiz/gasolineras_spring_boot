<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gasolineras</title>
  <link rel="stylesheet" th:href="@{/css/cliente.css}">

</head>
<body class="container">
<nav>
  <ul>
    <li><a href="/clientes/web">Clientes </a></li>
    <li><a href="/provincias/web">Provincias </a></li>
    <li><a href="/gasolineras/web">Gasolineras</a></li>
  </ul>
</nav>
<a href="/gasolineras/nuevo">
  <button type="submit">Crear Gasolinera</button>
</a>
<br><br>
<div class="contenido">
  <h1>LISTADO DE GASOLINERAS</h1>
  <div class="buscar">
  <input type="text" id="buscador" placeholder="Buscar..." style="padding: 8px 16px; border: 1px solid #e0dff5; border-radius: 12px; font-size: 14px; width: 420px; outline: none;"/>
  <script>
    document.getElementById("buscador").addEventListener("input", function () {

      let texto = this.value.toLowerCase();
      let filas = document.querySelectorAll("tbody tr");

      filas.forEach(fila => {
        let contenido = fila.textContent.toLowerCase();
        fila.style.display = contenido.includes(texto) ? "" : "none";
      });
    });
  </script>
</div>

  <table>
    <thead>
    <tr>
      <th>ID Gasolinera</th>
      <th>Nombre</th>
      <th>Activa</th>
      <th>Precio de la gasolina</th>
      <th>Provincia</th>
      <th>Opciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="g : ${gasolineras}">
      <form th:action="@{/gasolineras/guardar}" method="post">
      <td>
          <span th:if="${editingId != g.gasStationId}"
                th:text="${g.gasStationId}"></span>
        <input th:if="${editingId == g.gasStationId}"
               type="text"
               name="gasStationId"
               th:value="${g.gasStationId}">
        </td>
        <td>
          <span th:if="${editingId != g.gasStationId}"
                th:text="${g.name}"></span>
          <input th:if="${editingId == g.gasStationId}"
                 type="text"
                 name="name"
                 th:value="${g.name}">
        </td>
        <td>
    <span th:if="${editingId != g.gasStationId}"
          th:text="${g.active}">
    </span>
          <select name="active" th:if="${editingId == g.gasStationId}">
            <option value="Activo" th:selected="${g.active == 'true'}">Activo</option>
            <option value="Inactivo" th:selected="${g.active == 'false'}">Inactivo</option>
          </select>
        </td>

        <td>
          <span th:if="${editingId != g.gasStationId}"
                th:text="${g.petrolPrice}"></span>
          <input th:if="${editingId == g.gasStationId}"
                 type="text"
                 name="petrolPrice"
                 th:value="${g.petrolPrice}">
        </td>
        <td>
          <span th:if="${editingId != g.gasStationId}"
                th:text="${g.province?.name}"></span>
          <select th:if="${editingId == g.gasStationId}"
                  name="provinceId">
            <option value="">Sin Asignar</option>
            <option th:each="p : ${provincias}"
                    th:value="${p.provinceId}"
                    th:text="${p.name}"
                    th:selected="${g.province != null and p.provinceId == g.province.provinceId}">
            </option>
          </select>
          </td>


        <!-- OPCIONES -->
        <td>
          <div class ="acciones">
            <div th:if="${editingId != g.gasStationId}" class="normal">
              <a class ="editar" th:href="@{'/gasolineras/editar/' + ${g.gasStationId}}">Editar</a>
              <a class ="borrar" th:href="@{'/gasolineras/eliminar/' + ${g.gasStationId}}" onclick="return confirm('Seguro que quieres eliminar esta gasolinera?')">Eliminar</a>
            </div>
            <div th:if="${editingId == g.gasStationId}" class="edicion">
                <button type="submit" class="guardar">Guardar</button>
                <button type="button" class="cancelar" onclick="window.location.href='/gasolineras/web'">Cancelar</button>
            </div>
          </div>
        </td>
      </form>
    </tr>
    </tbody>

  </table>
</div>
</body>
</html>
